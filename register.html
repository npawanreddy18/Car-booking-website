
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your DriveEasy account.">
    <title>Sign Up | DriveEasy</title>
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>
<body>
    <header class="auth-header">
        <a class="auth-logo" href="index.html">🚘 Drive<span>Easy</span></a>
        <a class="back-link" href="index.html">← Back to Home</a>
    </header>

    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-icon" aria-hidden="true">✚</div>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join DriveEasy and plan your next journey.</p>

            <form id="register-form">
                <label for="full-name">Full Name</label>
                <input
                    type="text"
                    id="full-name"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    minlength="2"
                    maxlength="80"
                    required
                >

                <label for="register-email">Email Address</label>
                <input
                    type="email"
                    id="register-email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="register-phone">Phone Number</label>
                <input
                    type="tel"
                    id="register-phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    pattern="[0-9+() -]{7,20}"
                    title="Enter a valid phone number."
                    required
                >

                <label for="register-password">Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button type="button" class="show-password"
                        data-target="register-password">Show</button>
                </div>

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label class="terms-option">
                    <input type="checkbox" id="accept-terms" required>
                    <span>I agree to the <a href="terms.html">Terms</a>
                    and <a href="privacy.html">Privacy Policy</a>.</span>
                </label>

                <button type="submit" class="auth-submit">Create Account</button>
                <p id="register-message" class="form-message"
                    role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </section>
    </main>

    <footer class="auth-footer">
        &copy; <span class="current-year"></span> DriveEasy
    </footer>
</body>
</html>
