
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your DriveEasy account.">
    <title>Login | DriveEasy</title>
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>
<body>
    <header class="auth-header">
        <a class="auth-logo" href="index.html">🚘 Drive<span>Easy</span></a>
        <a class="back-link" href="index.html">← Back to Home</a>
    </header>

    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-icon" aria-hidden="true">♙</div>
            <h1>Welcome Back!</h1>
            <p class="auth-subtitle">Sign in to continue with DriveEasy.</p>

            <form id="login-form">
                <label for="login-email">Email Address</label>
                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="login-password">Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="show-password"
                        data-target="login-password">Show</button>
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox" id="remember-me">
                        Remember me
                    </label>
                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit" class="auth-submit">Login</button>
                <p id="login-message" class="form-message"
                    role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Sign Up</a>
            </p>
        </section>
    </main>

    <footer class="auth-footer">
        &copy; <span class="current-year"></span> DriveEasy
    </footer>
</body>
</html>
